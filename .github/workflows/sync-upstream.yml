name: Synchronize upstream sing-box release

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Optional stable sing-box tag (defaults to the latest release)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: synchronize-upstream-sing-box
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize and dispatch release build
    if: github.repository == 'LorenEteval/sing-box-python'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Detect latest stable release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          args=(check --github-output "$GITHUB_OUTPUT")
          if [[ -n "$REQUESTED_TAG" ]]; then
            args+=(--tag "$REQUESTED_TAG")
          fi
          python scripts/sync-sing-box.py "${args[@]}"

      - name: Verify current upstream source integrity
        if: steps.release.outputs.update_required != 'true'
        env:
          CURRENT_TAG: ${{ steps.release.outputs.current_tag }}
        run: python scripts/sync-sing-box.py verify --tag "$CURRENT_TAG"

      - name: Import upstream release
        if: steps.release.outputs.update_required == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python scripts/sync-sing-box.py sync --tag "$RELEASE_TAG"

      - uses: actions/setup-go@v7
        if: steps.release.outputs.update_required == 'true'
        with:
          go-version-file: .go-version
          cache-dependency-path: singbox-go/go.sum

      - name: Verify synchronized Go binding compiles
        if: steps.release.outputs.update_required == 'true'
        working-directory: singbox-go
        env:
          CGO_ENABLED: '1'
          GOTOOLCHAIN: local
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          expected="$(tr -d '\r\n' < ../.go-version)"
          actual="$(go env GOVERSION)"
          if [[ "$actual" != "go$expected" ]]; then
            echo "Expected Go $expected, found $actual" >&2
            exit 1
          fi
          build_tags="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS),with_purego,with_v2ray_api"
          ldflags="-X github.com/sagernet/sing-box/constant.Version=$RELEASE_TAG $(tr -d '\r\n' < release/LDFLAGS) -s -w -buildid="
          go build \
            -o "$RUNNER_TEMP/singbox-binding.a" \
            -buildmode=c-archive \
            -buildvcs=false \
            -trimpath \
            -tags "$build_tags" \
            -ldflags "$ldflags" \
            ./binding

      - name: Commit synchronized source
        if: steps.release.outputs.update_required == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Vendored files stay byte-for-byte identical to upstream and are
          # already validated by the sync script's blob and mode checks.
          git diff --check -- . ':(exclude)singbox-go/**'
          git add --all -- singbox-go .go-version UPSTREAM_COMMIT UPSTREAM_VERSION
          git diff --cached --check -- . ':(exclude)singbox-go/**'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --signoff --message "chore: sync sing-box $RELEASE_TAG"
          git push origin HEAD:main

      - name: Select release commit
        if: steps.release.outputs.release_required == 'true'
        id: release_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch build and publication workflow
        if: steps.release.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SYNC_COMMIT: ${{ steps.release_commit.outputs.sha }}
        run: |
          gh workflow run build-and-publish.yml \
            --ref main \
            --field checkout_ref="$SYNC_COMMIT" \
            --field release_tag="$RELEASE_TAG"
