[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "cmake>=3.15",
    "pybind11>=3.0.1,<3.1; python_version == '3.8'",
    "pybind11>=3.0.1,<4; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = [
    "cp39-*",
    "cp310-*",
    "cp311-*",
    "cp312-*",
    "cp313-*",
    "cp314-*",
    "cp314t-*",
]
skip = "*-musllinux_*"
build-verbosity = 1
test-requires = ["pytest>=8"]
test-sources = ["sample", "tests"]
test-environment = { PYTHONSAFEPATH = "1" }
test-command = [
    "python sample/sample.py",
    "pytest -q tests",
    "python -c \"import pathlib, singbox; source = pathlib.Path(r'{project}').resolve(); installed = pathlib.Path(singbox.__file__).resolve(); assert source not in installed.parents, 'imported source checkout: ' + str(installed)\"",
]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
before-all = '''
go_version="$(
    tr -d '\r\n' < "{project}/.go-version"
)"
if ! printf '%s\n' "${go_version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
    echo "Invalid Go version in .go-version: ${go_version}" >&2
    exit 1
fi
case "$(uname -m)" in
    x86_64)
        go_arch='amd64'
        ;;
    aarch64|arm64)
        go_arch='arm64'
        ;;
    *)
        echo "Unsupported Linux architecture: $(uname -m)" >&2
        exit 1
        ;;
esac
go_archive="/tmp/go${go_version}.linux-${go_arch}.tar.gz"
go_checksum="${go_archive}.sha256"
go_url="https://dl.google.com/go/go${go_version}.linux-${go_arch}.tar.gz"
curl -fsSLo "${go_archive}" "${go_url}"
curl -fsSLo "${go_checksum}" "${go_url}.sha256"
go_sha256="$(tr -d '\r\n' < "${go_checksum}")"
echo "${go_sha256}  ${go_archive}" | sha256sum -c -
tar -C /usr/local -xzf "${go_archive}"
/usr/local/go/bin/go version
'''
environment = { PATH = "/usr/local/go/bin:$PATH", GOTOOLCHAIN = "local" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0", GOTOOLCHAIN = "local" }
